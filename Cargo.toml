[package]
name = "r-todo"
version = "0.1.5"
edition = "2024"

[dependencies]
cli = { path = "crates/cli" }
database = { path = "crates/database" }

[workspace]
resolver = "3"
members = ["crates/cli", "crates/database"]


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
