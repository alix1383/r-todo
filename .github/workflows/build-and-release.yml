name: Release

on:
  push:
    tags:
      - 'v*' 

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: r-todo
            archive_name: r-todo-x86_64-unknown-linux-gnu.tar.gz
          

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: r-todo.exe
            archive_name: r-todo-x86_64-pc-windows-msvc.zip
          
 
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: r-todo
            archive_name: r-todo-x86_64-apple-darwin.tar.gz
          

          - os: macos-14
            target: aarch64-apple-darwin
            bin_name: r-todo
            archive_name: r-todo-aarch64-apple-darwin.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Tar for Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czf ${{ matrix.archive_name }} -C target/${{ matrix.target }}/release ${{ matrix.bin_name }}

      - name: Package (Zip for Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }} -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}
          path: ${{ matrix.archive_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release and Upload Files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
